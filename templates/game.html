<style>
/* Layout: суконный стол с картами соперников сверху, взяткой в центре и вашей рукой снизу; справа — панель решений и лист пульки */
:root{
  --felt:#1E4D3B; --felt2:#173D2F; --rim:#3A2A1C; --paper:#FBFAF5; --card:#FFFDF7; --ink:#1F2430; --muted:#5D6675;
  --red:#C0262D; --gold:#E2B44C; --line:#D5D2C8; --bg:#E7E4DA; --chip:#EEF0EA; --pool:#1D4ED8; --gora:#B42318; --good:#1F7A5A;
  --hand:"Caveat", cursive; --ui:"Golos Text", system-ui, sans-serif; --mono:"JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101418;--paper:#1A2027;--ink:#E5E7EB;--muted:#9AA3AF;--line:#2E3743;--chip:#222A33;--felt:#173B2E;--felt2:#112C22;--pool:#7AA2FF;--gora:#FF8A80;--good:#5FD3A5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101418;--paper:#1A2027;--ink:#E5E7EB;--muted:#9AA3AF;--line:#2E3743;--chip:#222A33;--felt:#173B2E;--felt2:#112C22;--pool:#7AA2FF;--gora:#FF8A80;--good:#5FD3A5;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--ui);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
h1{font:700 38px/1 var(--hand);margin:0}
h2{font:700 24px/1.1 var(--hand);margin:0 0 8px}
.sub{color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:920px){.layout{grid-template-columns:1fr}}
.table{background:radial-gradient(ellipse at center,var(--felt) 0%,var(--felt2) 100%);border:10px solid var(--rim);border-radius:28px;padding:14px;min-height:520px;display:grid;grid-template-rows:auto 1fr auto;gap:10px;color:#F3F1E8;min-width:0}
.opps{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

.seat{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px;flex-wrap:wrap}

.seat .tag.gold{background:var(--gold);color:#1F2430}
.backs{display:flex;margin-top:6px;min-height:46px}
.back{width:30px;height:44px;border-radius:5px;background:repeating-linear-gradient(45deg,#7A1F28 0 4px,#8E2A33 4px 8px);border:2px solid #F3F1E8;margin-right:-16px;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:210px}
.trick{display:flex;gap:14px;align-items:flex-end;min-height:120px;flex-wrap:wrap;justify-content:center}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.status{font:600 15px var(--ui);text-align:center;background:rgba(0,0,0,.28);padding:6px 12px;border-radius:999px;max-width:100%}
.prikup{display:flex;gap:8px}
.card{width:58px;height:84px;border-radius:7px;background:var(--card);color:#1F2430;border:1px solid #CFCAB8;display:flex;flex-direction:column;justify-content:space-between;padding:4px 6px;font:700 17px/1 var(--ui);box-shadow:0 2px 3px rgba(0,0,0,.35);position:relative;user-select:none}
.card .big{font-size:26px;align-self:center}

.me .seat{justify-content:center}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}

.btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
button{font:600 14px var(--ui);border-radius:6px;cursor:pointer}
.b{background:var(--ink);color:var(--paper);border:0;padding:9px 12px}

.b:disabled,.g:disabled{opacity:.35;cursor:not-allowed}

.tabs{display:flex;gap:6px}
.tabs button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 11px;border-radius:999px;font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:520px){.card{width:46px;height:68px;font-size:14px}.card .big{font-size:20px}.table{padding:10px;border-width:7px}}
@media (prefers-reduced-motion:reduce){.hand .card{transform:none!important}}
.tw{overflow-x:auto}.rr{padding-left:22px;margin:8px 0 12px}.rr li{margin:6px 0;max-width:72ch}.rt td,.rt th{white-space:normal}.rr+h3,.rt+h3{font-size:15px;margin:14px 0 6px}
</style>

<div class="wrap">
  <header>
    <div><h1>Ленинградка за столом</h1><div class="sub">Раздача, торговля, прикуп, вист и розыгрыш против двух или трёх ботов, с записью пули и рейтингом</div></div>
    <nav class="tabs" aria-label="Разделы"><button type="button" id="tab-play" data-t="play" aria-pressed="true">Игра</button><button type="button" id="tab-rating" data-t="rating" aria-pressed="false">Рейтинг</button><button type="button" id="tab-raspas" data-t="raspas" aria-pressed="false">Правила распасов</button></nav>
  </header>
  <div id="view"></div>
</div>

<script>
/*__ENGINE__*/
/*__CARDS__*/
</script>
<script>
const KEY = "pref_leningrad_game_v1";
const ls = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
let ratings = ls.ratings || {}, tab = "play";
let G = null; // текущая игра
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ ratings, setup: ls.setup })); } catch (e) {} };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (x) => (Math.round(x * 100) / 100).toLocaleString("ru-RU");
const RED = (s) => s === "♦" || s === "♥";
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let BOT_DELAY = 550;
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => { tab = b.dataset.t; draw(); });

function cardHTML(c, cls = "", attrs = "") {
  return `<div class="card ${RED(c.s) ? "red" : ""} ${cls}" ${attrs} aria-label="${c.r}${c.s}"><span>${c.r}${c.s}</span><span class="big">${c.s}</span><span class="bot">${c.r}${c.s}</span></div>`;
}

/* ---------- старт ---------- */
function setupView() {
  const st = ls.setup || { name: "Вы", n: 3, target: 20 };
  $("#view").innerHTML = `<div class="layout"><div class="panel"><h2>Новая пулька</h2>
    <label class="f">Ваше имя<input id="me" value="${esc(st.name)}"></label>
    <div class="seg" role="group" aria-label="Игроков"><button type="button" id="n3" data-n="3" aria-pressed="${st.n === 3}">Втроём</button><button type="button" id="n4" data-n="4" aria-pressed="${st.n === 4}">Вчетвером</button></div>
    <label class="f">Пуля каждому<select id="target">${[10, 20, 30].map((v) => `<option ${v === st.target ? "selected" : ""}>${v}</option>`).join("")}</select></label>
    <button type="button" class="b" id="go">Сесть за стол</button></div>
    <div class="panel"><h2>Как играть</h2><p>Торгуйтесь кнопками справа. Если игра ваша, возьмите прикуп, выберите две карты в снос и назначьте игру. В розыгрыше подсвечены карты, которыми можно ходить: нужно ходить в масть, без масти — козырем.</p><p class="sub">Запись ведётся по правилам Ленинградки: вист полуответственный, джентльменский, полвиста на 6-х и 7-х играх, распасы с прогрессией. Вчетвером сдающий пропускает раздачу.</p></div></div>`;
  let n = st.n;
  document.querySelectorAll("[data-n]").forEach((b) => b.onclick = () => { n = +b.dataset.n; document.querySelectorAll("[data-n]").forEach((x) => x.setAttribute("aria-pressed", x === b)); });
  $("#go").onclick = () => {
    const name = $("#me").value.trim() || "Вы";
    const bots = ["Профессор", "Мичман", "Тётя Валя"].filter((b) => b !== name).slice(0, n - 1);
    ls.setup = { name, n, target: +$("#target").value }; save();
    G = { pulka: PREF.newPulka([name, ...bots], { poolTarget: ls.setup.target }), human: 0, log: [] };
    G.pulka.dealer = Math.floor(Math.random() * n);
    newDeal();
  };
}

/* ---------- раздача и торговля ---------- */
function addLog(t) { G.log.unshift(t); }
function nm(i) { return G.pulka.players[i].name; }

function newDeal() {
  const act = PREF.activeOrder(G.pulka);
  const { hands, prikup } = CARDS.deal();
  G.d = { act, dealer: G.pulka.dealer, hands: {}, prikup, phase: "bid", bid: { turn: 0, current: null, passed: [], bidders: [], last: null }, declarer: null, contract: null,
          whist: {}, trick: [], tricks: {}, lead: act[0], showPrikup: false, discard: [], result: null };
  act.forEach((s, k) => { G.d.hands[s] = hands[k]; G.d.tricks[s] = 0; });
  addLog(`— Раздача ${G.pulka.hands.length + 1}. Сдаёт ${nm(G.pulka.dealer)}.${G.pulka.raspasStep ? ` Распасов подряд: ${G.pulka.raspasStep}, выход — не ниже ${PREF.exitLevel(G.pulka)}-й.` : ""}`);
  draw(); loop();
}

function bidOrderNext() {
  const b = G.d.bid, act = G.d.act;
  for (let k = 1; k <= 3; k++) { const t = (b.turn + k) % 3; if (!b.passed.includes(act[t])) { b.turn = t; return; } }
}

function makeBid(seat, bid) {
  const b = G.d.bid;
  if (bid === null) { b.passed.push(seat); addLog(`${nm(seat)}: пас`); }
  else { b.current = bid; b.last = seat; if (!b.bidders.includes(seat)) b.bidders.push(seat); addLog(`${nm(seat)}: ${bid}`); }
  const left = G.d.act.filter((s) => !b.passed.includes(s));
  if (b.passed.length === 3) return startRaspas();
  if (left.length === 1 && b.current) { G.d.declarer = left[0]; return startPrikup(); }
  bidOrderNext();
}

/* ---------- прикуп, снос, заказ ---------- */
function startPrikup() {
  const d = G.d;
  d.phase = "prikup"; d.showPrikup = true;
  addLog(`${nm(d.declarer)} играет. Прикуп: ${d.prikup.map((c) => c.r + c.s).join(" ")}`);
  d.hands[d.declarer] = CARDS.sortHand([...d.hands[d.declarer], ...d.prikup]);
}

function finishDiscard(cards) {
  const d = G.d;
  d.hands[d.declarer] = d.hands[d.declarer].filter((c) => !cards.includes(c));
  d.showPrikup = false;
  d.phase = "declare";
}

function declare(contract) {
  const d = G.d;
  d.contract = contract;
  addLog(`${nm(d.declarer)} заказывает ${contract}`);
  if (contract === "мизер") return startPlay();
  d.phase = "whist";
  d.defs = PREF.defendersOf(G.pulka, d.declarer);
  d.whist = { first: null, second: null, returned: false, asked: null };
}

/* ---------- вист ---------- */
function botWhist(seat, stage) {
  const d = G.d, lvl = PREF.levelOf(d.contract), need = G.pulka.rules.whistNeed[lvl];
  const est = CARDS.defenseEstimate(d.hands[seat], PREF.trumpOf(d.contract));
  if (lvl === 10) return "pass";
  if (stage === "first") return est >= Math.max(1, need / 2 - 0.5) ? "whist" : "pass";
  if (stage === "second") {
    if (d.whist.first === "whist") return est >= Math.max(1, need / 2 - 0.5) ? "whist" : "pass";
    if (est >= Math.max(1, need * 0.6)) return "whist";
    if (G.pulka.rules.halfWhistLevels.includes(lvl) && est >= 0.8) return "half";
    return "pass";
  }
  if (stage === "return") return est >= need * 0.6;
}

function whistStep(seat, decision) {
  const d = G.d, w = d.whist, [a, b] = d.defs;
  const t = { whist: "вист", pass: "пас", half: "полвиста" };
  if (w.first === null) { w.first = decision; addLog(`${nm(a)}: ${t[decision]}`); return; }
  if (w.second === null) { w.second = decision; addLog(`${nm(b)}: ${t[decision]}`); if (decision !== "half") resolveWhist(); return; }
  if (w.second === "half") { w.returned = decision; addLog(decision ? `${nm(a)} возвращает вист` : `${nm(a)} соглашается на полвиста`); resolveWhist(); }
}

function resolveWhist() {
  const d = G.d, w = d.whist, [a, b] = d.defs;
  const whisters = w.first === "whist" ? (w.second === "whist" ? [a, b] : [a]) : w.second === "whist" ? [b] : w.second === "half" && w.returned ? [a] : [];
  d.whisters = whisters;
  if (!whisters.length) return finishDeal();
  startPlay();
}

/* ---------- распасы и розыгрыш ---------- */
function startRaspas() {
  const d = G.d;
  d.contract = null; d.raspas = true; addLog("Все спасовали — распасы.");
  startPlay();
}

function startPlay() {
  const d = G.d;
  d.phase = "play"; d.trick = []; d.turn = G.d.act.indexOf(d.lead);
  d.trump = d.raspas || d.contract === "мизер" ? null : PREF.trumpOf(d.contract);
}

function roleOf(seat) {
  const d = G.d;
  if (d.raspas) return "raspas";
  if (d.contract === "мизер") return seat === d.declarer ? "misere" : "catch";
  return seat === d.declarer ? "declarer" : "defender";
}
const partners = (x, me) => { const d = G.d; if (d.raspas) return false; return x !== d.declarer && me !== d.declarer && x !== me; };

function playCard(seat, card) {
  const d = G.d;
  d.hands[seat] = d.hands[seat].filter((c) => c !== card);
  d.trick.push({ who: seat, card });
  if (d.trick.length === 3) {
    const w = CARDS.winner(d.trick, d.trump);
    d.tricks[w]++;
    d.lastTrick = { cards: d.trick, winner: w };
    d.pause = true;
    d.trickWinner = w;
  } else d.turn = (d.turn + 1) % 3;
}

function afterTrick() {
  const d = G.d;
  d.pause = false; d.trick = [];
  d.turn = d.act.indexOf(d.trickWinner);
  if (d.act.every((s) => d.hands[s].length === 0)) finishDeal();
}

/* ---------- запись результата ---------- */
function finishDeal() {
  const d = G.d;
  let h;
  if (d.raspas) h = { type: "raspas", tricks: { ...d.tricks } };
  else if (d.contract === "мизер") h = { type: "misere", declarer: d.declarer, tricks: d.tricks[d.declarer] };
  else {
    h = { type: "game", declarer: d.declarer, contract: d.contract, whist: { first: d.whist.first, second: d.whist.second, returned: !!d.whist.returned }, tricks: {} };
    if (d.whisters && d.whisters.length) {
      h.tricks[d.declarer] = d.tricks[d.declarer];
      if (d.whisters.length === 2) d.defs.forEach((s) => h.tricks[s] = d.tricks[s]);
    }
  }
  const delta = PREF.apply(G.pulka, h);
  d.result = delta.notes;
  d.phase = "done";
  addLog(delta.notes.join("\n"));
  if (G.pulka.closed && !G.rated) {
    const res = PREF.settle(G.pulka);
    PREF.updateRatings(ratings, res);
    G.rated = true; G.final = res; save();
  }
}

/* ---------- главный цикл ботов ---------- */
let looping = false;
async function loop() {
  if (looping) return; looping = true;
  try {
    while (G && G.d) {
      const d = G.d;
      if (d.phase === "bid") {
        const seat = d.act[d.bid.turn];
        if (seat === G.human && !G.auto) break;
        await sleep(BOT_DELAY);
        makeBid(seat, CARDS.botBid(d.hands[seat], d.bid.current, !d.bid.bidders.includes(seat), PREF.exitLevel(G.pulka)));
      } else if (d.phase === "prikup") {
        if (d.declarer === G.human && !G.auto) break;
        await sleep(BOT_DELAY * 2);
        finishDiscard(CARDS.botDiscard(d.hands[d.declarer], d.bid.current === "мизер"));
      } else if (d.phase === "declare") {
        if (d.declarer === G.human && !G.auto) break;
        await sleep(BOT_DELAY);
        declare(d.bid.current === "мизер" ? "мизер" : CARDS.botDeclare(d.hands[d.declarer], d.bid.current));
      } else if (d.phase === "whist") {
        const w = d.whist, [a, b] = d.defs;
        const seat = w.first === null ? a : w.second === null ? b : a;
        const stage = w.first === null ? "first" : w.second === null ? "second" : "return";
        if (seat === G.human && !G.auto) break;
        await sleep(BOT_DELAY);
        whistStep(seat, botWhist(seat, stage));
      } else if (d.phase === "play") {
        if (d.pause) { draw(); await sleep(BOT_DELAY ? 900 : 0); afterTrick(); draw(); continue; }
        const seat = d.act[d.turn];
        if (seat === G.human && !G.auto) break;
        await sleep(BOT_DELAY);
        playCard(seat, CARDS.botPlay(d.hands[seat], d.trick, d.trump, roleOf(seat), partners, seat));
      } else break;
      draw();
    }
  } finally { looping = false; draw(); }
}

/* ---------- отрисовка ---------- */
function draw() {
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.t === tab));
  if (tab === "rating") return ratingView();
  if (tab === "raspas") { $("#view").innerHTML = `<div class="panel">${PREF.raspasRulesHTML(G ? G.pulka.rules : PREF.DEFAULT_RULES)}</div>`; return; }
  if (!G) return setupView();
  const d = G.d, p = G.pulka, n = p.players.length;
  const seatsAround = []; for (let k = 1; k < n; k++) seatsAround.push((G.human + k) % n);
  const showAll = d.phase === "done";
  const oppHTML = (s) => {
    const inDeal = d.act.includes(s);
    const tags = [s === d.dealer ? '<span class="tag">сдаёт</span>' : "", s === d.declarer ? `<span class="tag gold">${esc(d.contract || d.bid.current || "")}</span>` : "",
      d.whisters && d.whisters.includes(s) ? '<span class="tag">вист</span>' : "", inDeal && d.phase === "play" || showAll ? `<span class="tag">взяток: ${d.tricks[s]}</span>` : ""].join("");
    const cards = !inDeal ? '<span class="sub" style="color:#cfe">не играет</span>' : showAll && d.hands[s].length ? `<div class="hand" style="justify-content:flex-start">${d.hands[s].map((c) => cardHTML(c)).join("")}</div>` : `<div class="backs">${d.hands[s].map(() => '<div class="back"></div>').join("")}</div>`;
    return `<div class="opp"><div class="seat">${esc(nm(s))} ${tags}</div>${cards}</div>`;
  };
  const trickSlots = (d.pause && d.lastTrick ? d.lastTrick.cards : d.trick).map((x) => `<div class="slot">${cardHTML(x.card)}<span>${esc(nm(x.who))}</span></div>`).join("");
  const me = G.human, inDealMe = d.act.includes(me);
  // какие мои карты активны
  let okIds = [];
  if (d.phase === "play" && !d.pause && d.act[d.turn] === me) okIds = CARDS.legal(d.hands[me], d.trick, d.trump).map((c) => c.id);
  const discardMode = d.phase === "prikup" && d.declarer === me;
  const myHand = inDealMe ? d.hands[me].map((c) => cardHTML(c, discardMode ? (d.discard.includes(c.id) ? "sel ok" : "ok") : okIds.includes(c.id) ? "ok" : d.phase === "play" && d.act[d.turn] === me ? "dim" : "", `data-id="${c.id}" ${discardMode || okIds.includes(c.id) ? 'role="button" tabindex="0"' : ""}`)).join("") : '<span class="sub" style="color:#cfe">Вы сдаёте и пропускаете эту раздачу</span>';

  $("#view").innerHTML = `<div class="layout">
    <div class="table">
      <div class="opps">${seatsAround.map(oppHTML).join("")}</div>
      <div class="center">
        <div class="status" aria-live="polite">${statusText()}</div>
        ${d.showPrikup ? `<div class="prikup">${d.prikup.map((c) => cardHTML(c)).join("")}</div>` : `<div class="trick">${trickSlots}</div>`}
      </div>
      <div class="me"><div class="seat">${esc(nm(me))} ${me === d.dealer ? '<span class="tag">сдаёт</span>' : ""} ${me === d.declarer ? `<span class="tag gold">${esc(d.contract || d.bid.current || "")}</span>` : ""} ${d.whisters && d.whisters.includes(me) ? '<span class="tag">вист</span>' : ""} ${inDealMe && (d.phase === "play" || showAll) ? `<span class="tag">взяток: ${d.tricks[me]}</span>` : ""}</div><div class="hand" style="margin-top:8px">${myHand}</div></div>
    </div>
    <div>
      <div class="panel" id="controls">${controls()}</div>
      <div class="panel"><h2>Пулька</h2>${sheet()}</div>
      <div class="panel"><h2>Ход игры</h2><div class="log">${esc(G.log.slice(0, 60).join("\n"))}</div></div>
    </div></div>`;
  bindControls();
  document.querySelectorAll(".hand .card.ok").forEach((el) => {
    const act = () => onCard(el.dataset.id);
    el.onclick = act; el.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } };
  });
}

function statusText() {
  const d = G.d;
  if (d.phase === "bid") { const s = d.act[d.bid.turn]; return s === G.human ? "Ваш ход в торговле" : `Торгуется ${esc(nm(s))}…`; }
  if (d.phase === "prikup") return d.declarer === G.human ? "Прикуп ваш — выберите 2 карты в снос" : `${esc(nm(d.declarer))} берёт прикуп`;
  if (d.phase === "declare") return d.declarer === G.human ? "Назначьте игру" : `${esc(nm(d.declarer))} назначает игру`;
  if (d.phase === "whist") return "Вистующие решают";
  if (d.phase === "play") {
    const what = d.raspas ? "Распасы" : d.contract === "мизер" ? `Мизер, играет ${esc(nm(d.declarer))}` : `${esc(d.contract)}, играет ${esc(nm(d.declarer))}`;
    if (d.pause) return `${what} · взятку берёт ${esc(nm(d.trickWinner))}`;
    return `${what} · ${d.act[d.turn] === G.human ? "ваш ход" : "ходит " + esc(nm(d.act[d.turn]))}`;
  }
  if (d.phase === "done") return G.pulka.closed ? "Пулька закрыта" : "Раздача записана";
  return "";
}

function controls() {
  const d = G.d, me = G.human;
  if (d.phase === "bid" && d.act[d.bid.turn] === me) {
    const canMis = !d.bid.bidders.includes(me);
    const ex = PREF.exitLevel(G.pulka);
    const avail = PREF.CONTRACTS.filter((c) => CARDS.contractRank(c) > CARDS.contractRank(d.bid.current) && (c === "мизер" ? canMis : parseInt(c) >= ex));
    return `<h2>Торговля</h2><p class="sub">Текущая ставка: ${esc(d.bid.current || "нет")}${ex > 6 ? ` · выход из распасов: не ниже ${ex}-й` : ""}</p>
      <div class="btns">${avail.slice(0, 4).map((c) => `<button type="button" class="b" data-bid="${c}">${c}</button>`).join("")}</div>
      <label class="f">Другая ставка<select id="bidSel">${avail.map((c) => `<option>${c}</option>`).join("")}</select></label>
      <div class="btns"><button type="button" class="g" id="bidOther">Сказать выбранное</button><button type="button" class="g" data-bid="">Пас</button></div>`;
  }
  if (d.phase === "prikup" && d.declarer === me)
    return `<h2>Снос</h2><p class="sub">Выбрано ${d.discard.length} из 2. Нажмите на карты в руке.</p><button type="button" class="b" id="discardOk" ${d.discard.length === 2 ? "" : "disabled"}>Снести</button>`;
  if (d.phase === "declare" && d.declarer === me) {
    if (d.bid.current === "мизер") return `<h2>Мизер</h2><button type="button" class="b" data-decl="мизер">Играть мизер</button>`;
    const avail = PREF.CONTRACTS.filter((c) => c !== "мизер" && CARDS.contractRank(c) >= CARDS.contractRank(d.bid.current));
    return `<h2>Заказ игры</h2><p class="sub">Не ниже ${esc(d.bid.current)}</p><label class="f">Игра<select id="declSel">${avail.map((c) => `<option>${c}</option>`).join("")}</select></label><button type="button" class="b" id="declOk">Заказать</button>`;
  }
  if (d.phase === "whist") {
    const w = d.whist, [a, b] = d.defs, lvl = PREF.levelOf(d.contract);
    const seat = w.first === null ? a : w.second === null ? b : a;
    if (seat === me) {
      if (w.first === null) return `<h2>Вист?</h2><p class="sub">${esc(nm(d.declarer))} играет ${esc(d.contract)}. Вы первый.</p><div class="btns"><button type="button" class="b" data-w="whist">Вист</button><button type="button" class="g" data-w="pass">Пас</button></div>`;
      if (w.second === null) { const half = w.first === "pass" && G.pulka.rules.halfWhistLevels.includes(lvl); return `<h2>Вист?</h2><p class="sub">${esc(nm(a))} сказал «${w.first === "whist" ? "вист" : "пас"}».</p><div class="btns"><button type="button" class="b" data-w="whist">Вист</button><button type="button" class="g" data-w="pass">Пас</button>${half ? '<button type="button" class="g" data-w="half">Полвиста</button>' : ""}</div>`; }
      return `<h2>Полвиста</h2><p class="sub">${esc(nm(b))} сказал «полвиста». Вернуть вист и играть самому?</p><div class="btns"><button type="button" class="b" data-w="ret">Вернуть вист</button><button type="button" class="g" data-w="agree">Согласиться</button></div>`;
    }
    return `<h2>Вист</h2><p class="sub">Решают защитники…</p>`;
  }
  if (d.phase === "done") {
    const fin = G.pulka.closed ? `<h2>Итог пульки</h2><table><thead><tr><th>Игрок</th><th class="n">Висты</th></tr></thead><tbody>${[...G.final].sort((x, y) => y.total - x.total).map((r) => `<tr><td>${esc(r.name)}</td><td class="n ${r.total > 0 ? "pos" : r.total < 0 ? "neg" : ""}">${r.total > 0 ? "+" : ""}${fmt(r.total)}</td></tr>`).join("")}</tbody></table><p class="sub">Результат записан в рейтинг.</p><div class="btns"><button type="button" class="b" id="again">Новая пулька</button></div>` : "";
    return `<h2>Раздача записана</h2><div class="notes">${esc((d.result || []).join("\n") || "Без записи")}</div>${fin || '<div class="btns"><button type="button" class="b" id="next">Следующая раздача</button></div>'}`;
  }
  if (d.phase === "play") return `<h2>Розыгрыш</h2><p class="sub">${d.raspas ? "Распасы: старайтесь не брать взяток." : d.contract === "мизер" ? (d.declarer === me ? "Ваш мизер: не берите ни одной взятки." : "Ловите мизер: заставьте играющего взять взятку.") : d.declarer === me ? `Вам нужно взять ${PREF.levelOf(d.contract)} взяток.` : "Вы защищаетесь."}</p><p class="sub">Козырь: ${d.trump || "нет"}</p>`;
  return `<h2>Ход соперников</h2><p class="sub">Ждём…</p>`;
}

function bindControls() {
  const d = G.d;
  document.querySelectorAll("[data-bid]").forEach((b) => b.onclick = () => { makeBid(G.human, b.dataset.bid || null); draw(); loop(); });
  $("#bidOther") && ($("#bidOther").onclick = () => { makeBid(G.human, $("#bidSel").value); draw(); loop(); });
  $("#discardOk") && ($("#discardOk").onclick = () => { finishDiscard(d.hands[G.human].filter((c) => d.discard.includes(c.id))); d.discard = []; draw(); });
  document.querySelectorAll("[data-decl]").forEach((b) => b.onclick = () => { declare(b.dataset.decl); draw(); loop(); });
  $("#declOk") && ($("#declOk").onclick = () => { declare($("#declSel").value); draw(); loop(); });
  document.querySelectorAll("[data-w]").forEach((b) => b.onclick = () => {
    const v = b.dataset.w;
    whistStep(G.human, v === "ret" ? true : v === "agree" ? false : v); draw(); loop();
  });
  $("#next") && ($("#next").onclick = () => newDeal());
  $("#again") && ($("#again").onclick = () => { G = null; draw(); });
}

function onCard(id) {
  const d = G.d;
  if (d.phase === "prikup" && d.declarer === G.human) {
    d.discard = d.discard.includes(id) ? d.discard.filter((x) => x !== id) : d.discard.length < 2 ? [...d.discard, id] : d.discard;
    return draw();
  }
  if (d.phase === "play" && d.act[d.turn] === G.human && !d.pause) {
    const c = d.hands[G.human].find((x) => x.id === id);
    if (!c || !CARDS.legal(d.hands[G.human], d.trick, d.trump).includes(c)) return;
    playCard(G.human, c); draw(); loop();
  }
}

function sheet() {
  const p = G.pulka, st = PREF.settle(p);
  return `<table><thead><tr><th>Игрок</th><th class="n">Пуля</th><th class="n">Гора</th><th class="n">Итог</th></tr></thead><tbody>${p.players.map((pl, i) => `<tr><td>${esc(pl.name)}</td><td class="n">${fmt(pl.pool)}/${p.rules.poolTarget}</td><td class="n">${fmt(pl.gora)}</td><td class="n ${st[i].total > 0 ? "pos" : st[i].total < 0 ? "neg" : ""}">${st[i].total > 0 ? "+" : ""}${fmt(st[i].total)}</td></tr>`).join("")}</tbody></table>
  <p class="sub">Висты: ${p.players.map((pl, i) => pl.whists.map((v, j) => v ? `${esc(pl.name)} на ${esc(p.players[j].name)} ${fmt(v)}` : "").filter(Boolean).join(", ")).filter(Boolean).join("; ") || "пока нет"}</p>`;
}

function ratingView() {
  const rows = Object.entries(ratings).sort((a, b) => b[1].rating - a[1].rating);
  $("#view").innerHTML = `<div class="panel"><h2>Рейтинг и рекорды</h2>${rows.length ? `<table><thead><tr><th>#</th><th>Игрок</th><th class="n">Рейтинг</th><th class="n">Пулек</th><th class="n">Побед</th><th class="n">Лучший итог</th><th class="n">Средний</th></tr></thead><tbody>${rows.map(([n, r], k) => `<tr><td>${k + 1}</td><td>${esc(n)}</td><td class="n">${r.rating}</td><td class="n">${r.pulkas}</td><td class="n">${r.wins}</td><td class="n">${fmt(r.best)}</td><td class="n">${fmt(r.sum / r.pulkas)}</td></tr>`).join("")}</tbody></table>` : '<p class="sub">Рейтинг появится после первой сыгранной до конца пульки.</p>'}
  <p class="sub">Эло по итогам пулек, старт 1500. Данные хранятся в этом браузере.</p></div>`;
}

draw();
</script>
